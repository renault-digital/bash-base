name: cicd

# Run the workflow when a Pull Request is opened or when changes are pushed to master
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

jobs:
  lint-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: lint commit message of this pull request
        uses: wagoid/commitlint-github-action@v2

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: shellcheck-shfmt
        run: npm run lint

  test:
    runs-on: ubuntu-22.04
    steps:
      # Fetch the latest commit
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test strict coverage union and Cobertura export
        run: python3 -m unittest discover -s tests -p 'test_coverage_union_v3.py' -v

      # Run the actual Bash/zsh gate, then the existing Bash ShellSpec/kcov suite.
      - name: Bash/zsh compatibility and Bash ShellSpec coverage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bash zsh kcov netcat-openbsd lsof
          command -v kcov
          # Fetch the versioned installer directly; do not stream a short URL to sh.
          installer="$(mktemp "$RUNNER_TEMP/shellspec-install.XXXXXX")"
          trap 'rm -f "$installer"' EXIT
          installer_url="https://raw.githubusercontent.com/shellspec/shellspec/0.28.1/install.sh"
          printf 'SHELLSPEC_INSTALLER_URL=%s\n' "$installer_url"
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 15 --max-time 120 \
            --output "$installer" "$installer_url"
          test -s "$installer"
          sh "$installer" 0.28.1 --yes
          export PATH="$HOME/.local/bin:$PATH"
          shellspec_version="$("$HOME/.local/bin/shellspec" --version)"
          printf 'SHELLSPEC_VERSION=%s\n' "$shellspec_version"
          if [[ "$shellspec_version" != '0.28.1' ]]; then
            echo "::error::Expected ShellSpec 0.28.1, got $shellspec_version"
            exit 1
          fi
          bash -c 'echo BASH_VERSION: $BASH_VERSION'
          zsh --version
          bash scripts/test.sh --kcov -f t

      - name: Show uncovered source lines
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          report = Path("coverage/cobertura.xml")
          if not report.is_file():
              raise SystemExit(f"Missing coverage report: {report}")
          
          root = ET.parse(report).getroot()
          classes = root.findall(".//class")
          
          print(f"Report: {report}")
          print(f"Classes found: {len(classes)}")
          print("Recorded filenames:")
          for cls in classes:
              print(" ", cls.get("filename", "<missing>"))
          
          targets = {
              "alias.sh", "argument.sh", "array.sh",
              "constant.sh", "document.sh", "out.sh",
              "process.sh", "reflection.sh",
              "string.sh", "tool.sh",
          }
          
          found = 0
          missing_total = 0
          
          for cls in classes:
              filename = cls.get("filename", "")
              if Path(filename).name not in targets:
                  continue
          
              found += 1
              lines = cls.findall("./lines/line")
          
              missing = sorted({
                  int(line.get("number"))
                  for line in lines
                  if int(line.get("hits", "0")) == 0
              })
          
              missing_total += len(missing)
              print(f"{filename}: {len(missing)} uncovered lines")
              print(f"  {missing}")
          
          print(f"Matched source entries: {found}")
          print(f"Total uncovered entries: {missing_total}")
          
          if not classes or not found:
              raise SystemExit(
                  "Coverage XML structure or source paths need inspection"
              )
          PY

      # Linux reports remain diagnostic artifacts only. The authoritative
      # 100% gate and the sole Codecov upload use the validated macOS union.
      # ShellSpec 0.28.1 supports --covdir for a separate zsh report.
      - name: Probe zsh coverage
        continue-on-error: false
        run: |
          test -f coverage/coverage.json
          set +e
          bash "$HOME/.local/lib/shellspec/shellspec" \
            --shell zsh --kcov --covdir coverage-zsh \
            --pattern '*.spec.sh' --fail-no-examples -f t \
            spec/string.spec.sh spec/reflection.spec.sh
          status=$?
          set -e

          echo "zsh ShellSpec/coverage exit status: $status"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path('coverage-zsh').rglob('cobertura.xml'))
          print(f'zsh Cobertura reports: {len(reports)}')
          for report in reports:
              print(f'Report: {report}')
              for cls in ET.parse(report).getroot().iter('class'):
                  filename = cls.get('filename', '')
                  if Path(filename).name not in {'string.sh', 'reflection.sh'}:
                      continue
                  lines = list(cls.iter('line'))
                  covered = sum(int(line.get('hits', '0')) > 0 for line in lines)
                  print(f'  {filename}: {covered}/{len(lines)} reported lines covered')
          PY
          exit "$status"

      # Preserve the raw reports for review when the 100% gate fails.
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics
          path: |
            coverage/
            coverage-zsh/
          if-no-files-found: warn
          retention-days: 7


  # Authoritative 100% line-coverage gate. GitHub's macos-15 ARM64 runner has
  # /bin/bash 3.2 and /bin/zsh; Homebrew supplies Bash 5+ and kcov.
  # Collect four reports from a single checkout, then validate the strict union.
  coverage-macos:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Codecov's PR report must describe the exact source revision tested.
          # The separate Linux job still tests GitHub's default PR merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test strict coverage union and Cobertura export
        run: python3 -m unittest discover -s tests -p 'test_coverage_union_v3.py' -v

      - name: Install coverage tools (ShellSpec pinned to 0.28.1)
        shell: bash
        run: |
          set -euo pipefail
          brew install bash kcov
          # Fetch the versioned installer directly; do not stream a short URL to sh.
          installer="$(mktemp "$RUNNER_TEMP/shellspec-install.XXXXXX")"
          trap 'rm -f "$installer"' EXIT
          installer_url="https://raw.githubusercontent.com/shellspec/shellspec/0.28.1/install.sh"
          printf 'SHELLSPEC_INSTALLER_URL=%s\n' "$installer_url"
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 15 --max-time 120 \
            --output "$installer" "$installer_url"
          test -s "$installer"
          sh "$installer" 0.28.1 --yes
          export PATH="$HOME/.local/bin:$PATH"
          shellspec_version="$("$HOME/.local/bin/shellspec" --version)"
          printf 'SHELLSPEC_VERSION=%s\n' "$shellspec_version"
          if [[ "$shellspec_version" != '0.28.1' ]]; then
            echo "::error::Expected ShellSpec 0.28.1, got $shellspec_version"
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          /bin/bash -c 'printf "BASH32=%s\n" "$BASH_VERSION"'
          "$(brew --prefix)/bin/bash" -c 'printf "BASH5=%s\n" "$BASH_VERSION"'
          /bin/zsh --version
          kcov --version
          command -v nc
          command -v lsof

      - name: Run strict Bash 3.2 / Bash 5+ / zsh / TTY coverage gate
        id: strict_coverage
        shell: bash
        run: |
          set -uo pipefail
          tested_sha="$(git rev-parse HEAD)" || exit 1
          printf 'tested_sha=%s\n' "$tested_sha" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_COMMIT=%s\n' "$tested_sha"
          # Retain both statuses immediately; neither tee nor an upload may
          # turn a failed coverage gate into a successful check.
          set +e
          bash scripts/verify-final-coverage-v3.sh "$PWD" 2>&1 |
            tee "$RUNNER_TEMP/bash-base-coverage-gate.log"
          pipeline_status=("${PIPESTATUS[@]}")
          gate_status=${pipeline_status[0]}
          log_status=${pipeline_status[1]}
          set -e
          if [[ "$log_status" -ne 0 ]]; then
            echo "::error::Cannot save strict coverage evidence."
            exit 1
          fi
          log="$RUNNER_TEMP/bash-base-coverage-gate.log"
          coverage_root_line="$(grep -m 1 '^COVERAGE_ROOT=' "$log" || true)"
          report_dir="${coverage_root_line#COVERAGE_ROOT=}"
          upload_report=""
          if [[ -n "$report_dir" ]]; then
            printf 'coverage_root=%s\n' "$report_dir" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$tested_sha" > "$report_dir/source.commit"
            # Reporting a real coverage decrease is allowed; publishing an
            # unvalidated report or swallowing the gate failure is not.
            if [[ -s "$report_dir/union/cobertura.xml" ]] &&
              grep -qx 'SOURCE_SHA256_UNCHANGED=yes' "$log" &&
              grep -qx 'MEASURABLE_LINE_SETS=PASS full_reports=3 supplemental_reports=1' "$log" &&
              grep -Eq '^COVERAGE_GATE=(PASS_100_PERCENT|FAIL_MISSING_[1-9][0-9]*)$' "$log"; then
              upload_report="$report_dir/union/cobertura.xml"
              printf 'upload_report=%s\n' "$upload_report" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [[ "$gate_status" -eq 0 && -z "$upload_report" ]]; then
            echo "::error::Coverage gate passed without a validated upload report."
            exit 1
          fi
          exit "$gate_status"

      - name: Upload validated strict union to Codecov
        # Include genuine <100% results, while leaving strict_coverage failed.
        if: ${{ !cancelled() && steps.strict_coverage.outputs.upload_report != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.strict_coverage.outputs.upload_report }}
          disable_search: true
          disable_file_fixes: true
          plugins: noop
          flags: strict-union
          name: strict-macos-union
          override_commit: ${{ steps.strict_coverage.outputs.tested_sha }}
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: true
          handle_no_reports_found: false
          verbose: true

      - name: Upload strict coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-macos-coverage
          path: |
            ${{ runner.temp }}/bash-base-coverage-gate.log
            ${{ steps.strict_coverage.outputs.coverage_root }}
          if-no-files-found: warn
          retention-days: 7

  semantic-release-preview:
    # PR dry runs exit before verifying npm credentials; do not grant OIDC to PR jobs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    # Waits for test jobs to complete
    needs: [lint-commit,lint,test,coverage-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-compatible npm
        run: |
          npm install --global npm@11.21.0
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: semantic-release dry run to preview of the pending release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: npx semantic-release --dry-run

  semantic-release:
    # Only release on push to master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    # Waits for test jobs to complete
    needs: [semantic-release-preview]
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-compatible npm
        run: |
          npm install --global npm@11.21.0
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: npx semantic-release
