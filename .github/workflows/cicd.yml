name: cicd

# Run the workflow when a Pull Request is opened or when changes are pushed to master
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

jobs:
  lint-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: lint commit message of this pull request
        uses: wagoid/commitlint-github-action@v2

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: shellcheck-shfmt
        run: npm run lint

  test:
    runs-on: ubuntu-22.04
    steps:
      # Fetch the latest commit
      - name: Checkout
        uses: actions/checkout@v4

      # Run the actual Bash/zsh gate, then the existing Bash ShellSpec/kcov suite.
      - name: Bash/zsh compatibility and Bash ShellSpec coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y bash zsh kcov netcat-openbsd lsof
          command -v kcov
          curl -fsSL https://git.io/shellspec | sh -s 0.28.1 --yes
          export PATH="$HOME/.local/bin:$PATH"
          bash -c 'echo BASH_VERSION: $BASH_VERSION'
          zsh --version
          bash scripts/test.sh --kcov -f t

      - name: codecov.io
        run: bash <(curl -s https://codecov.io/bash)

      - name: Show uncovered source lines
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          report = Path("coverage/cobertura.xml")
          if not report.is_file():
              raise SystemExit(f"Missing coverage report: {report}")
          
          root = ET.parse(report).getroot()
          classes = root.findall(".//class")
          
          print(f"Report: {report}")
          print(f"Classes found: {len(classes)}")
          print("Recorded filenames:")
          for cls in classes:
              print(" ", cls.get("filename", "<missing>"))
          
          targets = {
              "alias.sh", "argument.sh", "array.sh",
              "constant.sh", "document.sh", "out.sh",
              "process.sh", "reflection.sh",
              "string.sh", "tool.sh",
          }
          
          found = 0
          missing_total = 0
          
          for cls in classes:
              filename = cls.get("filename", "")
              if Path(filename).name not in targets:
                  continue
          
              found += 1
              lines = cls.findall("./lines/line")
          
              missing = sorted({
                  int(line.get("number"))
                  for line in lines
                  if int(line.get("hits", "0")) == 0
              })
          
              missing_total += len(missing)
              print(f"{filename}: {len(missing)} uncovered lines")
              print(f"  {missing}")
          
          print(f"Matched source entries: {found}")
          print(f"Total uncovered entries: {missing_total}")
          
          if not classes or not found:
              raise SystemExit(
                  "Coverage XML structure or source paths need inspection"
              )
          PY

      # ShellSpec 0.28.1 supports --covdir. Collect zsh coverage separately
      # without touching the Bash coverage/ report used by the 100% gate.
      # Diagnostic only: do not merge unverified zsh coverage into that gate.
      - name: Probe zsh coverage
        continue-on-error: false
        run: |
          test -f coverage/coverage.json
          set +e
          bash "$HOME/.local/lib/shellspec/shellspec" \
            --shell zsh --kcov --covdir coverage-zsh \
            --pattern '*.spec.sh' --fail-no-examples -f t \
            spec/string.spec.sh spec/reflection.spec.sh
          status=$?
          set -e

          echo "zsh ShellSpec/coverage exit status: $status"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path('coverage-zsh').rglob('cobertura.xml'))
          print(f'zsh Cobertura reports: {len(reports)}')
          for report in reports:
              print(f'Report: {report}')
              for cls in ET.parse(report).getroot().iter('class'):
                  filename = cls.get('filename', '')
                  if Path(filename).name not in {'string.sh', 'reflection.sh'}:
                      continue
                  lines = list(cls.iter('line'))
                  covered = sum(int(line.get('hits', '0')) > 0 for line in lines)
                  print(f'  {filename}: {covered}/{len(lines)} reported lines covered')
          PY
          exit "$status"

      # Preserve the raw reports for review when the 100% gate fails.
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics
          path: |
            coverage/
            coverage-zsh/
          if-no-files-found: warn
          retention-days: 7


  # Authoritative 100% line-coverage gate. GitHub's macos-15 ARM64 runner has
  # /bin/bash 3.2 and /bin/zsh; Homebrew supplies Bash 5+ and kcov.
  # Collect four reports from a single checkout, then validate the strict union.
  coverage-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coverage tools (ShellSpec pinned to 0.28.1)
        shell: bash
        run: |
          set -euo pipefail
          brew install bash kcov
          curl -fsSL https://git.io/shellspec | sh -s 0.28.1 --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          /bin/bash -c 'printf "BASH32=%s\n" "$BASH_VERSION"'
          "$(brew --prefix)/bin/bash" -c 'printf "BASH5=%s\n" "$BASH_VERSION"'
          /bin/zsh --version
          "$HOME/.local/bin/shellspec" --version
          kcov --version
          command -v nc
          command -v lsof

      - name: Run strict Bash 3.2 / Bash 5+ / zsh / TTY coverage gate
        id: strict_coverage
        shell: bash
        run: |
          set -uo pipefail
          # Capture the original script exit status even when tee succeeds.
          set +e
          bash scripts/verify-final-coverage-v3.sh "$PWD" 2>&1 |
            tee "$RUNNER_TEMP/bash-base-coverage-gate.log"
          gate_status=${PIPESTATUS[0]}
          set -e
          coverage_root_line="$(grep -m 1 '^COVERAGE_ROOT='             "$RUNNER_TEMP/bash-base-coverage-gate.log" || true)"
          report_dir="${coverage_root_line#COVERAGE_ROOT=}"
          if [[ -n "$report_dir" ]]; then
            printf 'coverage_root=%s\n' "$report_dir" >> "$GITHUB_OUTPUT"
          fi
          exit "$gate_status"

      - name: Upload strict coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-macos-coverage
          path: |
            ${{ runner.temp }}/bash-base-coverage-gate.log
            ${{ steps.strict_coverage.outputs.coverage_root }}
          if-no-files-found: warn
          retention-days: 7

  semantic-release-preview:
    # PR dry runs exit before verifying npm credentials; do not grant OIDC to PR jobs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    # Waits for test jobs to complete
    needs: [lint-commit,lint,test,coverage-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-compatible npm
        run: |
          npm install --global npm@11.21.0
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: semantic-release dry run to preview of the pending release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: npx semantic-release --dry-run

  semantic-release:
    # Only release on push to master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    # Waits for test jobs to complete
    needs: [semantic-release-preview]
    permissions:
      contents: write
      packages: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install OIDC-compatible npm
        run: |
          npm install --global npm@11.21.0
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: npx semantic-release
